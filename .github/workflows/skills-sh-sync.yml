name: CLAW-603 Permanent Test Claim Proof

on:
  workflow_dispatch:

concurrency:
  group: claw-603-permanent-test-proof
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  permanent-test-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: Test
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      DEPLOY_SHA: 9f037c18061e39cf8734bae416c1fda2f9a2f81b
      TEST_SITE_URL: ${{ vars.SITE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Prove the deterministic claim lifecycle without paid scans
        run: |
          set -euo pipefail
          mkdir -p proof/claw-603
          operator_token=""
          cleanup() {
            set +e
            bunx convex run --no-push skillsShMirror:configureInternal \
              '{
                "actor":"CLAW-603 permanent Test claim workflow",
                "reason":"CLAW-603 claim proof cleanup",
                "confirm":"enable-skills-sh-mirror-test",
                "enabled":false,
                "maxRowsPerRun":50000,
                "maxRowsPerBatch":50,
                "maxDetailBytes":65536
              }' > proof/claw-603/claim-control-disabled.json 2>&1
            disable_exit=$?
            bunx convex run --no-push devSeed:seedCliRoleHelpFixtures '{}' >/dev/null
            token_rotation_exit=$?
            if [[ -n "$operator_token" ]]; then
              revoked_status="$(
                curl --silent --output /dev/null --write-out '%{http_code}' \
                  --header "Authorization: Bearer $operator_token" \
                  https://academic-chihuahua-392.convex.site/api/v1/operator/skills-sh/catalog-test
              )"
            else
              revoked_status="not-created"
            fi
            jq -n \
              --argjson disableExit "$disable_exit" \
              --argjson tokenRotationExit "$token_rotation_exit" \
              --arg revokedStatus "$revoked_status" \
              '{disableExit:$disableExit,tokenRotationExit:$tokenRotationExit,revokedStatus:$revokedStatus}' \
              > proof/claw-603/claim-cleanup.json
            set -e
          }
          trap cleanup EXIT

          bunx convex run --no-push appMeta:getDeploymentInfo '{}' > proof/claw-603/claim-deployment.json
          jq -e --arg sha "$DEPLOY_SHA" '.appBuildSha == $sha' proof/claw-603/claim-deployment.json >/dev/null
          bunx convex run --no-push rolloutCapabilities:getPublicCapabilities '{}' \
            > proof/claw-603/claim-capabilities-before.json
          jq -e '.skillsSh.publicCatalogEnabled == true and .skillsSh.scanPlanningEnabled == false and .skillsSh.scanAdmissionEnabled == false' \
            proof/claw-603/claim-capabilities-before.json >/dev/null

          token_seed="$(bunx convex run --no-push devSeed:seedCliRoleHelpFixtures '{}')"
          operator_token="$(jq -r '.admin.token // empty' <<<"$token_seed")"
          token_seed=""
          [[ -n "$operator_token" ]]
          echo "::add-mask::$operator_token"

          export CLAWHUB_TEST_OPERATOR_TOKEN="$operator_token"
          export CLAWHUB_TEST_MIRROR_GATE_URL="$TEST_SITE_URL/ops/skills-sh/mirror-test?x-vercel-protection-bypass=$VERCEL_AUTOMATION_BYPASS_SECRET"
          export CLAWHUB_CLAIM_PROOF_OUTPUT="proof/claw-603/claim-lifecycle.json"
          bun scripts/skills-sh-catalog/claw-603-claim-proof.ts \
            > proof/claw-603/claim-lifecycle-stdout.json

          bunx convex run --no-push rolloutCapabilities:getPublicCapabilities '{}' \
            > proof/claw-603/claim-capabilities-after.json
          jq -e '.ok == true and .target.productionWrites == 0 and .paidScans == 0 and .scansPlanned == 0 and .scansAdmitted == 0' \
            proof/claw-603/claim-lifecycle.json >/dev/null

          cleanup
          trap - EXIT
          jq -e '.disableExit == 0 and .tokenRotationExit == 0 and .revokedStatus == "401"' \
            proof/claw-603/claim-cleanup.json >/dev/null

      - name: Upload CLAW-603 claim proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: claw-603-claim-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: proof/claw-603/
