name: CLAW-603 Permanent Test Drift Audit

on:
  workflow_dispatch:

concurrency:
  group: claw-603-permanent-test-proof
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  permanent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Test
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      DEPLOY_SHA: 58b82dc6d2ad5ef573a12733e593caa0a5fda96f
      LEADERBOARD_RUN_ID: hs7nw9pgdqvtm6cxf9y4xhqs6x8bgdv6
      TRENDING_RUN_ID: hs7s8h07d3910rn8taxwn91y8x8bh617
      ACCIDENTAL_RUN_ID: hs7skp9a8p46s83p3rm9vhw01h8bg1pe
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 58b82dc6d2ad5ef573a12733e593caa0a5fda96f

      - uses: ./.github/actions/setup-bun

      - name: Audit exact permanent-Test drift without mutation
        run: |
          set -euo pipefail
          mkdir -p proof/claw-603
          bunx convex run --no-push appMeta:getDeploymentInfo '{}' > proof/claw-603/deployment.json
          jq -e --arg sha "$DEPLOY_SHA" '.appBuildSha == $sha' proof/claw-603/deployment.json >/dev/null
          bunx convex run --no-push rolloutCapabilities:getPublicCapabilities '{}' \
            > proof/claw-603/capabilities.json
          bunx convex run --no-push skillsShMirror:getIsolationInternal '{}' \
            > proof/claw-603/isolation.json
          bunx convex run --no-push skillsShMirrorVisibility:auditInternal '{}' \
            > proof/claw-603/visibility-audit.json
          bunx convex run --no-push --inline-query "
            const runs = await Promise.all([
              ctx.db.get('$LEADERBOARD_RUN_ID'),
              ctx.db.get('$TRENDING_RUN_ID'),
              ctx.db.get('$ACCIDENTAL_RUN_ID'),
            ]);
            return runs.map((run) => run ? {
              runId: run._id,
              status: run.status,
              sourceView: run.sourceView ?? 'leaderboard',
              sourceTotal: run.sourceTotal,
              counts: run.counts,
              startedAt: run.startedAt,
              completedAt: run.completedAt ?? null,
            } : null);
          " > proof/claw-603/runs.json

          : > proof/claw-603/provenance-pages.jsonl
          cursor="null"
          while true; do
            page="$(bunx convex run --no-push --inline-query "
              const result = await ctx.db.query('skillsShMirrorDigests').paginate({cursor:$cursor,numItems:500});
              return {
                isDone: result.isDone,
                continueCursor: result.continueCursor,
                page: result.page.map((row) => ({
                  externalId: row.externalId,
                  lastObservedRunId: row.lastObservedRunId,
                  active: row.active,
                  sourceFreshnessStatus: row.sourceFreshnessStatus,
                  claimStatus: row.claimStatus ?? null,
                  publicVisible: row.publicVisible,
                  installable: row.installable,
                  githubPath: row.githubPath ?? null,
                  githubCommit: row.githubCommit ?? null,
                  sourceContentHash: row.sourceContentHash ?? null,
                  tombstoned: row.tombstonedAt !== undefined,
                })),
              };
            ")"
            jq -c . <<<"$page" >> proof/claw-603/provenance-pages.jsonl
            if [[ "$(jq -r '.isDone' <<<"$page")" == "true" ]]; then
              break
            fi
            cursor="$(jq -c '.continueCursor' <<<"$page")"
          done

          jq -s \
            --arg leaderboard "$LEADERBOARD_RUN_ID" \
            --arg trending "$TRENDING_RUN_ID" \
            --arg accidental "$ACCIDENTAL_RUN_ID" '
              [.[].page[]] as $rows |
              {
                pages: length,
                total: ($rows | length),
                uniqueExternalIds: ($rows | map(.externalId) | unique | length),
                provenance: {
                  leaderboard: ($rows | map(select(.lastObservedRunId == $leaderboard)) | length),
                  trending: ($rows | map(select(.lastObservedRunId == $trending)) | length),
                  accidental: ($rows | map(select(.lastObservedRunId == $accidental)) | length),
                  other: ($rows | map(select(.lastObservedRunId != $leaderboard and .lastObservedRunId != $trending and .lastObservedRunId != $accidental)) | length)
                },
                accidentalPartition: {
                  total: ($rows | map(select(.lastObservedRunId == $accidental)) | length),
                  active: ($rows | map(select(.lastObservedRunId == $accidental and .active == true)) | length),
                  observedOnly: ($rows | map(select(.lastObservedRunId == $accidental and .sourceFreshnessStatus == "observed-only")) | length),
                  stale: ($rows | map(select(.lastObservedRunId == $accidental and .sourceFreshnessStatus == "stale")) | length),
                  claimed: ($rows | map(select(.lastObservedRunId == $accidental and .claimStatus != null)) | length),
                  visibleInstallable: ($rows | map(select(.lastObservedRunId == $accidental and .publicVisible == true and .installable == true)) | length),
                  immutableInstallable: ($rows | map(select(.lastObservedRunId == $accidental and .githubCommit != null and .sourceContentHash != null)) | length),
                  tombstoned: ($rows | map(select(.lastObservedRunId == $accidental and .tombstoned == true)) | length)
                }
              }
            ' proof/claw-603/provenance-pages.jsonl > proof/claw-603/provenance-summary.json
          jq -e '.total == .uniqueExternalIds and .provenance.accidental == 2077' \
            proof/claw-603/provenance-summary.json >/dev/null

      - name: Upload CLAW-603 drift audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: claw-603-drift-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: proof/claw-603/
