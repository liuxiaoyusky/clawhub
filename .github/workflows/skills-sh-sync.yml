name: CLAW-603 Final Permanent Test Full Corpus Proof

on:
  workflow_dispatch:

concurrency:
  group: claw-603-permanent-test-proof
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  permanent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      proof_complete: ${{ steps.complete.outputs.proof_complete }}
    environment:
      name: Test
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      DEPLOY_SHA: 110f92a0ef1c88889b09f80801421998a114988b
      GH_TOKEN: ${{ github.token }}
      TEST_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
      TEST_SITE_URL: ${{ vars.SITE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RECOVERABLE_RUN_ID: hs7xrkfgx78qsxh26frnkmy9yx8bjq97
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 110f92a0ef1c88889b09f80801421998a114988b

      - uses: ./.github/actions/setup-bun

      - name: Replace the contaminated Test corpus with one coherent fresh pair
        id: recovery
        run: |
          set -euo pipefail
          mkdir -p proof/claw-603
          operator_token=""
          token_seeded=0
          activated=0
          proof_complete=0
          finalizing=0
          mirror_url="$TEST_SITE_URL/ops/skills-sh/mirror-test"

          post_mirror() {
            local body="$1"
            local output="$2"
            curl \
              --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $operator_token" \
              --header "Content-Type: application/json" \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              --data "$body" \
              "$mirror_url" > "$output"
          }

          deactivate_fail_closed() {
            local reason="$1"
            local output="$2"
            local body
            body="$(jq -nc --arg reason "$reason" '{operation:"deactivate",reason:$reason}')"
            if ! post_mirror "$body" "$output"; then
              bunx convex run --no-push skillsShMirrorVisibility:setPublicGateInternal \
                "$(jq -nc --arg reason "$reason" '{
                  enabled:false,
                  actor:"CLAW-603 permanent Test workflow",
                  reason:$reason,
                  confirm:"deactivate-skills-sh-public-test"
                }')" > "${output%.json}-direct.json" 2>&1
            fi
          }

          cleanup() {
            set +e
            if [[ "$token_seeded" != "1" ]]; then
              jq -n '{disableExit:0,tokenRotationExit:0,revokedStatus:"not-created"}' \
                > proof/claw-603/cleanup.json
              set -e
              return
            fi
            if [[ "$proof_complete" != "1" && "$finalizing" != "1" && -n "$operator_token" ]]; then
              public_visible="unknown"
              if post_mirror '{"operation":"status"}' proof/claw-603/failure-status.json; then
                public_visible="$(
                  jq -r '.invariants.publicVisible // false' \
                    proof/claw-603/failure-status.json 2>/dev/null
                )"
              fi
              if [[ "$activated" == "1" || "$public_visible" != "false" ]]; then
                deactivate_fail_closed \
                  "CLAW-603 fresh recovery proof failed closed" \
                  proof/claw-603/failure-deactivation.json
              fi
            fi
            bunx convex run --no-push skillsShMirror:configureInternal \
              '{
                "actor":"CLAW-603 permanent Test workflow",
                "reason":"CLAW-603 fresh recovery cleanup",
                "confirm":"enable-skills-sh-mirror-test",
                "enabled":false,
                "maxRowsPerRun":50000,
                "maxRowsPerBatch":50,
                "maxDetailBytes":65536
              }' > proof/claw-603/control-disabled.json 2>&1
            disable_exit=$?
            if [[ "$finalizing" == "1" && "$disable_exit" != "0" && -n "$operator_token" ]]; then
              deactivate_fail_closed \
                "CLAW-603 fresh recovery control cleanup failed closed" \
                proof/claw-603/failure-deactivation.json
            fi
            bunx convex run --no-push devSeed:seedCliRoleHelpFixtures '{}' >/dev/null
            token_rotation_exit=$?
            if [[ "$finalizing" == "1" && "$token_rotation_exit" != "0" ]]; then
              deactivate_fail_closed \
                "CLAW-603 fresh recovery token cleanup failed closed" \
                proof/claw-603/failure-deactivation.json
            fi
            if [[ -n "$operator_token" ]]; then
              revoked_status="$(
                curl --silent --output /dev/null --write-out '%{http_code}' \
                  --request POST \
                  --header "Authorization: Bearer $operator_token" \
                  --header "Content-Type: application/json" \
                  --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                  --data '{"operation":"status"}' \
                  "$mirror_url"
              )"
            else
              revoked_status="unverifiable"
            fi
            jq -n \
              --argjson disableExit "$disable_exit" \
              --argjson tokenRotationExit "$token_rotation_exit" \
              --arg revokedStatus "$revoked_status" \
              '{disableExit:$disableExit,tokenRotationExit:$tokenRotationExit,revokedStatus:$revokedStatus}' \
              > proof/claw-603/cleanup.json
            if [[
              "$finalizing" == "1" &&
              "$disable_exit" == "0" &&
              "$token_rotation_exit" == "0" &&
              "$revoked_status" == "401"
            ]]; then
              proof_complete=1
            elif [[ "$finalizing" == "1" ]]; then
              deactivate_fail_closed \
                "CLAW-603 fresh recovery cleanup verification failed closed" \
                proof/claw-603/failure-deactivation.json
            fi
            set -e
          }
          trap cleanup EXIT

          bunx convex run --no-push appMeta:getDeploymentInfo '{}' > proof/claw-603/deployment.json
          bunx convex run --no-push rolloutCapabilities:getPublicCapabilities '{}' \
            > proof/claw-603/capabilities-before.json
          bunx convex run --no-push skillsShMirror:getIsolationInternal '{}' \
            > proof/claw-603/isolation-before.json
          jq -e --arg sha "$DEPLOY_SHA" '.appBuildSha == $sha' \
            proof/claw-603/deployment.json >/dev/null
          jq -e '
            .skillsSh.publicCatalogEnabled == false and
            .skillsSh.discoveryEnabled == false and
            .skillsSh.writesEnabled == false and
            .skillsSh.scanPlanningEnabled == false and
            .skillsSh.scanAdmissionEnabled == false
          ' proof/claw-603/capabilities-before.json >/dev/null
          jq -e '
            (.catalogScanAttempts.count | type == "number") and
            (.nativeScanJobs.count | type == "number") and
            (.nativeScanJobs.updatedAtSum | type == "number")
          ' proof/claw-603/isolation-before.json >/dev/null

          # This one-shot operator branch is not merged or scheduled. Reuse the completed
          # claim proof without mutating Test again, and fail closed if either pinned
          # artifact is unavailable before this closeout dispatch.
          mkdir -p proof/claw-603/claim-proof-initial proof/claw-603/claim-proof-recovery
          gh run download 30608116457 \
            --repo openclaw/clawhub \
            --name claw-603-claim-native-proof-30608116457-1 \
            --dir proof/claw-603/claim-proof-initial
          gh run download 30609603963 \
            --repo openclaw/clawhub \
            --name claw-603-claim-native-proof-30609603963-1 \
            --dir proof/claw-603/claim-proof-recovery
          jq -s -e '
            map(.stage) as $stages |
            [
              "first-claim-pending",
              "first-claim-failed",
              "corrected-claim-pending",
              "corrected-claim-passed",
              "native-followup-pending",
              "native-followup-failed",
              "native-restoration-pending",
              "native-restoration-passed"
            ] as $expected |
            [
              $stages[] |
              select(. as $stage | ($expected | index($stage)) != null)
            ] == $expected
          ' proof/claw-603/claim-proof-initial/claim-lifecycle.json.checkpoints.jsonl \
            >/dev/null
          jq -e '
            .ok == true and
            .resumedFromProofRun == 30608116457 and
            .paidScans == 0 and
            .scansPlanned == 0 and
            .scansAdmitted == 0 and
            .queuesBefore == .queuesAfter and
            .isolationBefore == .isolationAfter and
            .final.alias.kind == "redirect" and
            .final.alias.canonicalRef == "@patrick-erichsen/html" and
            .final.installResponse.status == 200 and
            .final.installResponse.body.github.commit == "050daba89f6b6636470add5cb300aac46a412cf8" and
            .final.installResponse.body.github.contentHash == "a47adb2c1ac33c088f664b5187971b63d2b958a7b9f01516d26005ca941a108f"
          ' proof/claw-603/claim-proof-recovery/claim-lifecycle.json >/dev/null

          bunx convex run --no-push --inline-query '
            return await ctx.db.query("skillHourlyStatStates")
              .withIndex("by_key", q => q.eq("key", "canonical_trending"))
              .unique();
          ' > proof/claw-603/hourly-state-before.json
          if ! jq -e '
            .backfillCompletedAt != null and
            .lastAggregationCompletedAt != null and
            (.lastAggregationCompletedAt / 1000) > (now - 7200)
          ' proof/claw-603/hourly-state-before.json >/dev/null 2>&1; then
            bunx convex run --no-push migrations:runSkillHourlyStatsBackfill \
              '{"dryRun":false,"confirm":"apply-skill-hourly-stats-backfill"}' \
              > proof/claw-603/hourly-backfill.json
            bunx convex run --no-push skillStatEvents:processSkillStatEventsAction '{}' \
              > proof/claw-603/hourly-aggregation.json
          fi
          hourly_ready=0
          for _ in $(seq 1 60); do
            bunx convex run --no-push --inline-query '
              return await ctx.db.query("skillHourlyStatStates")
                .withIndex("by_key", q => q.eq("key", "canonical_trending"))
                .unique();
            ' > proof/claw-603/hourly-state-ready.json
            if jq -e '
              .backfillCompletedAt != null and
              .lastAggregationCompletedAt != null and
              (.lastAggregationCompletedAt / 1000) > (now - 7200)
            ' proof/claw-603/hourly-state-ready.json >/dev/null; then
              hourly_ready=1
              break
            fi
            sleep 5
          done
          [[ "$hourly_ready" == "1" ]]

          native_skill_id="$(
            bunx convex run --no-push --inline-query '
              const publisher = await ctx.db.query("publishers")
                .withIndex("by_handle", q => q.eq("handle", "patrick-erichsen"))
                .unique();
              if (!publisher) return null;
              const row = await ctx.db.query("skills")
                .withIndex("by_owner_publisher_slug", q => q
                  .eq("ownerPublisherId", publisher._id)
                  .eq("slug", "html"))
                .unique();
              return row?._id ?? null;
            ' | jq -r '. // empty'
          )"
          [[ -n "$native_skill_id" ]]
          bunx convex run --no-push canonicalTrending:getNativeSourceBatchInternal \
            "$(jq -nc --arg skillId "$native_skill_id" '{skillIds:[$skillId]}')" \
            > proof/claw-603/native-digest-before-sync.json
          jq -e --arg skillId "$native_skill_id" '
            .documentsRead == 1 and
            (.page | length) == 1 and
            .page[0].skillId == $skillId and
            .page[0].publicVersion.status == "available"
          ' proof/claw-603/native-digest-before-sync.json >/dev/null

          current_hour_start="$(( $(date +%s) / 3600 * 3600 * 1000 ))"
          occurred_at="$(( current_hour_start - 30 * 60 * 1000 ))"
          day_start="$(( occurred_at / 86400000 * 86400000 ))"
          identity_hash="claw-603-native-corpus-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bunx convex run --no-push downloadMetrics:recordDownloadMetricInternal \
            "$(
              jq -nc \
                --arg skillId "$native_skill_id" \
                --arg identityHash "$identity_hash" \
                --argjson dayStart "$day_start" \
                --argjson occurredAt "$occurred_at" \
                '{
                  target:{kind:"skill",id:$skillId},
                  identityKind:"user",
                  identityHash:$identityHash,
                  dayStart:$dayStart,
                  occurredAt:$occurredAt
                }'
            )" > proof/claw-603/native-download-event.json
          bunx convex run --no-push skillStatEvents:processSkillStatEventsAction '{}' \
            > proof/claw-603/native-event-processing.json
          bunx convex run --no-push skillHourlyStats:getStateInternal '{}' \
            > proof/claw-603/native-hourly-state.json
          current_hour="$(( $(date +%s) / 3600 ))"
          start_hour="$(( current_hour - 24 ))"
          end_hour="$(( current_hour - 1 ))"
          active_generation="$(jq -r '.activeGeneration' proof/claw-603/native-hourly-state.json)"
          : > proof/claw-603/native-hourly-pages.jsonl
          hourly_cursor=""
          native_hourly_found=0
          declare -A hourly_seen_cursors=()
          while true; do
            hourly_page="$(
              bunx convex run --no-push canonicalTrending:getHourlySourcePageInternal \
                "$(
                  jq -nc \
                    --arg cursor "$hourly_cursor" \
                    --argjson startHour "$start_hour" \
                    --argjson endHour "$end_hour" \
                    --argjson maxGeneration "$active_generation" \
                    '{
                      startHour:$startHour,
                      endHour:$endHour,
                      maxGeneration:$maxGeneration,
                      paginationOpts:{
                        cursor:(if $cursor == "" then null else $cursor end),
                        numItems:250
                      }
                    }'
                )"
            )"
            jq -c . <<<"$hourly_page" >> proof/claw-603/native-hourly-pages.jsonl
            if jq -e --arg skillId "$native_skill_id" '
              any(.page[]; .skillId == $skillId and .downloads > 0)
            ' <<<"$hourly_page" >/dev/null; then
              native_hourly_found=1
              break
            fi
            if jq -e '.isDone == true' <<<"$hourly_page" >/dev/null; then
              break
            fi
            hourly_cursor="$(jq -r '.continueCursor // empty' <<<"$hourly_page")"
            [[ -n "$hourly_cursor" ]]
            if [[ -n "${hourly_seen_cursors[$hourly_cursor]+x}" ]]; then
              echo "::error::Hourly source pagination repeated a cursor"
              exit 1
            fi
            hourly_seen_cursors["$hourly_cursor"]=1
          done
          [[ "$native_hourly_found" == "1" ]]

          token_seed="$(bunx convex run --no-push devSeed:seedCliRoleHelpFixtures '{}')"
          token_seeded=1
          operator_token="$(jq -r '.admin.token // empty' <<<"$token_seed")"
          token_seed=""
          [[ -n "$operator_token" ]]
          echo "::add-mask::$operator_token"

          post_mirror '{"operation":"status"}' proof/claw-603/mirror-status-before.json
          jq -e --arg recoverable "$RECOVERABLE_RUN_ID" '
            .control.enabled == false and
            .control.paused == true and
            ([.runs[] | select(.status == "running" or .status == "paused" or .status == "reconciling")] as $active |
              ($active | length) == 0 or
              (($active | length) == 1 and
                $active[0].runId == $recoverable and
                $active[0].sourceView == "trending" and
                $active[0].counts.scansPlanned == 0 and
                $active[0].counts.scansAdmitted == 0)) and
            .invariants.publicVisible == false and
            .invariants.installable == false and
            .invariants.scanPlanningEnabled == false and
            .invariants.scanAdmissionEnabled == false
          ' proof/claw-603/mirror-status-before.json >/dev/null
          recoverable_active="$(jq --arg recoverable "$RECOVERABLE_RUN_ID" '
            [.runs[] | select(
              (.status == "running" or .status == "paused" or .status == "reconciling") and
              .runId == $recoverable
            )] | length
          ' proof/claw-603/mirror-status-before.json)"

          post_mirror \
            '{"operation":"configure","enabled":true,"reason":"CLAW-603 native-only pre-import proof"}' \
            proof/claw-603/native-only-configured.json
          post_mirror \
            '{"operation":"prepare-native-trending","reason":"CLAW-603 native-only pre-import proof"}' \
            proof/claw-603/native-only-before-import.json
          curl --fail-with-body --silent --show-error \
            "$TEST_CONVEX_SITE_URL/api/v1/trending?kind=skills&limit=100" \
            > proof/claw-603/native-only-before-import-api.json
          jq -e '
            .enabled == false and
            .nativeTrending.status == "ready" and
            .nativeTrending.sourceCounts.skillsShTrending == 0 and
            ((.nativeTrending.sourceCounts.clawhubTrending // 0) +
              (.nativeTrending.sourceCounts.clawhubRising // 0)) > 0 and
            .scansPlanned == 0 and
            .scansAdmitted == 0
          ' proof/claw-603/native-only-before-import.json >/dev/null
          jq -e '
            .snapshotId != null and
            (.items | length) > 0 and
            all(.items[]; .source == "clawhub")
          ' proof/claw-603/native-only-before-import-api.json >/dev/null

          export CLAWHUB_SKILLS_SH_SYNC_TOKEN="$operator_token"
          export CLAWHUB_SKILLS_SH_SYNC_URL="$mirror_url?x-vercel-protection-bypass=$VERCEL_AUTOMATION_BYPASS_SECRET"
          export CLAWHUB_SKILLS_SH_SYNC_REASON="CLAW-603 permanent Test coherent fresh recovery $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          export CLAWHUB_SKILLS_SH_SYNC_OUTPUT="proof/claw-603/skills-sh-sync-proof.json"
          bun scripts/skills-sh-catalog/sync.ts > proof/claw-603/skills-sh-sync-stdout.json
          activated=1

          bunx convex run --no-push skillsShMirror:getIsolationInternal '{}' \
            > proof/claw-603/isolation-after.json
          bunx convex run --no-push skillsShMirrorVisibility:auditInternal '{}' \
            > proof/claw-603/visibility-audit.json
          bunx convex run --no-push rolloutCapabilities:getPublicCapabilities '{}' \
            > proof/claw-603/capabilities-after.json
          post_mirror '{"operation":"status"}' proof/claw-603/mirror-status-after.json

          jq -e \
            --arg recoverable "$RECOVERABLE_RUN_ID" \
            --argjson expectedRecovery "$recoverable_active" '
              .ok == true and
              .nativeBefore.nativeTrending.status == "ready" and
              .nativeBefore.nativeTrending.sourceCounts.skillsShTrending == 0 and
              ((.nativeBefore.nativeTrending.sourceCounts.clawhubTrending // 0) +
                (.nativeBefore.nativeTrending.sourceCounts.clawhubRising // 0)) > 0 and
              (if $expectedRecovery == 1 then
                .recovered.runId == $recoverable and
                .recovered.status == "completed" and
                .recovered.sourceView == "trending" and
                .recovered.counts.observed == .recovered.sourceTotal and
                .recovered.counts.scansPlanned == 0 and
                .recovered.counts.scansAdmitted == 0
              else
                (has("recovered") | not)
              end) and
              .leaderboard.status == "completed" and
              .leaderboard.sourceView == "leaderboard" and
              .leaderboard.runId != $recoverable and
              .leaderboard.counts.observed == .leaderboard.sourceTotal and
              .leaderboard.counts.rejected > 0 and
              .leaderboard.counts.quarantined > 0 and
              .leaderboard.counts.scansPlanned == 0 and
              .leaderboard.counts.scansAdmitted == 0 and
              .trending.status == "completed" and
              .trending.sourceView == "trending" and
              .trending.runId != $recoverable and
              .trending.runId != .leaderboard.runId and
              .trending.startedAt >= .leaderboard.completedAt and
              .trending.counts.observed == .trending.sourceTotal and
              .trending.counts.trendingJoined + .trending.counts.trendingMissing ==
                .trending.sourceTotal and
              .trending.counts.scansPlanned == 0 and
              .trending.counts.scansAdmitted == 0 and
              .activation.activated == true and
              .activation.leaderboard.accepted ==
                (.leaderboard.sourceTotal - .leaderboard.counts.rejected) and
              .activation.leaderboard.rejected == .leaderboard.counts.rejected and
              .activation.corpus.hiddenEligible == 0 and
              .activation.corpus.unsafePublished == 0 and
              .scansPlanned == 0 and
              .scansAdmitted == 0
          ' proof/claw-603/skills-sh-sync-proof.json >/dev/null
          jq -e '
            .skillsSh.publicCatalogEnabled == true and
            .skillsSh.discoveryEnabled == true and
            .skillsSh.writesEnabled == false and
            .skillsSh.scanPlanningEnabled == false and
            .skillsSh.scanAdmissionEnabled == false
          ' proof/claw-603/capabilities-after.json >/dev/null
          jq -e '
            .counts.total == (.counts.active + .counts.tombstoned) and
            .counts.eligible == .counts.eligiblePublished and
            .counts.hiddenEligible == 0 and
            .counts.unsafePublished == 0 and
            .counts.claimPromoted == 1 and
            .counts.claimExcluded == 1 and
            .counts.claimFailed == 0 and
            .counts.claimRetrying == 0 and
            .scansPlanned == 0 and
            .scansAdmitted == 0
          ' proof/claw-603/visibility-audit.json >/dev/null
          jq -e \
            --slurpfile before proof/claw-603/isolation-before.json \
            --slurpfile after proof/claw-603/isolation-after.json '
              ($before[0].catalogScanAttempts == $after[0].catalogScanAttempts) and
              ($before[0].nativeScanJobs == $after[0].nativeScanJobs)
            ' <<<"{}" >/dev/null
          jq -e '
            .control.enabled == false and
            .control.paused == true and
            ([.runs[] | select(.status == "running" or .status == "paused" or .status == "reconciling")] | length == 0) and
            .invariants.scanPlanningEnabled == false and
            .invariants.scanAdmissionEnabled == false
          ' proof/claw-603/mirror-status-after.json >/dev/null
          leaderboard_run_id="$(jq -r '.leaderboard.runId' proof/claw-603/skills-sh-sync-proof.json)"
          trending_run_id="$(jq -r '.trending.runId' proof/claw-603/skills-sh-sync-proof.json)"
          jq -e \
            --arg leaderboard "$leaderboard_run_id" \
            --arg trending "$trending_run_id" '
              .control.latestCompletedLeaderboardRunId == $leaderboard and
              ([.runs[] | select(.runId == $leaderboard and .status == "completed" and .sourceView == "leaderboard")] | length == 1) and
              ([.runs[] | select(.runId == $trending and .status == "completed" and .sourceView == "trending")] | length == 1)
            ' proof/claw-603/mirror-status-after.json >/dev/null

          public_site="$TEST_CONVEX_SITE_URL"
          bunx convex run --no-push --inline-query '
            const candidates = ctx.db.query("skillsShMirrorDigests")
              .withIndex("by_active_visible_installable_fresh_slug", q => q
                .eq("active", true)
                .eq("publicVisible", true)
                .eq("installable", true)
                .eq("sourceFreshnessStatus", "observed-only"));
            for await (const row of candidates) {
              if (
                row.sourceType === "github" &&
                row.claimStatus === undefined &&
                row.tombstonedAt === undefined &&
                typeof row.owner === "string" &&
                typeof row.repo === "string" &&
                typeof row.githubPath === "string" &&
                typeof row.githubCommit === "string" &&
                row.githubCommit.length === 40 &&
                typeof row.sourceContentHash === "string" &&
                row.sourceContentHash.length === 64
              ) {
                return {
                  externalId: row.externalId,
                  owner: row.owner,
                  repo: row.repo,
                  slug: row.slug,
                  githubPath: row.githubPath,
                  githubCommit: row.githubCommit,
                  sourceContentHash: row.sourceContentHash,
                  lastObservedRunId: row.lastObservedRunId,
                  trendingObservedRunId: row.trendingObservedRunId ?? null,
                };
              }
            }
            return null;
          ' > proof/claw-603/external-target.json
          jq -e '
            .externalId == (.owner + "/" + .repo + "/" + .slug) and
            (.githubPath | type == "string" and length > 0) and
            (.githubCommit | type == "string" and length == 40) and
            (.sourceContentHash | type == "string" and length == 64)
          ' proof/claw-603/external-target.json >/dev/null
          external_id="$(jq -r '.externalId' proof/claw-603/external-target.json)"
          external_owner="$(jq -r '.owner' proof/claw-603/external-target.json)"
          external_repo="$(jq -r '.repo' proof/claw-603/external-target.json)"
          external_slug="$(jq -r '.slug' proof/claw-603/external-target.json)"
          external_path="$(jq -r '.githubPath' proof/claw-603/external-target.json)"
          external_commit="$(jq -r '.githubCommit' proof/claw-603/external-target.json)"
          external_hash="$(jq -r '.sourceContentHash' proof/claw-603/external-target.json)"
          external_ref="skills-sh:$external_id"
          encoded_ref="$(jq -rn --arg value "$external_ref" '$value|@uri')"
          encoded_owner="$(jq -rn --arg value "$external_owner" '$value|@uri')"
          encoded_repo="$(jq -rn --arg value "$external_repo" '$value|@uri')"
          encoded_slug="$(jq -rn --arg value "$external_slug" '$value|@uri')"
          external_route="/skills-sh/$encoded_owner/$encoded_repo/$encoded_slug"
          curl --fail-with-body --silent --show-error \
            "$public_site/api/v1/search?q=$encoded_ref&mode=exact&limit=10" \
            > proof/claw-603/search-exact.json
          curl --fail-with-body --silent --show-error \
            "$public_site/api/v1/skills-sh/$encoded_owner/$encoded_repo/$encoded_slug" \
            > proof/claw-603/detail.json
          curl --fail-with-body --silent --show-error \
            "$public_site/api/v1/skills-sh/$encoded_owner/$encoded_repo/$encoded_slug/install" \
            > proof/claw-603/install.json
          curl --fail-with-body --silent --show-error \
            "$public_site/api/v1/skills/$encoded_slug/verify?reference=$encoded_ref" \
            > proof/claw-603/verify.json
          jq -e --arg ref "$external_ref" --arg route "$external_route" '
            [.results[] | select(.id == $ref)] as $matches |
            ($matches | length) == 1 and
            $matches[0].canonicalUrl == $route and
            $matches[0].install.reference == $ref
          ' proof/claw-603/search-exact.json >/dev/null
          jq -e \
            --arg ref "$external_ref" \
            --arg path "$external_path" \
            --arg commit "$external_commit" \
            --arg hash "$external_hash" '
            .reference == $ref and
            .githubPath == $path and
            .githubCommit == $commit and
            .sourceContentHash == $hash and
            (.content.markdown | length) > 0
          ' proof/claw-603/detail.json >/dev/null
          jq -e \
            --arg ref "$external_ref" \
            --arg repo "$external_owner/$external_repo" \
            --arg path "$external_path" \
            --arg commit "$external_commit" \
            --arg hash "$external_hash" '
            .ok == true and
            .slug == $ref and
            .installKind == "github" and
            .github.repo == $repo and
            .github.path == $path and
            .github.commit == $commit and
            .github.contentHash == $hash and
            .provenance.source == "skills.sh" and
            .trust.clawhubScan == "unscanned" and
            .trust.label == "Not scanned by ClawHub"
          ' proof/claw-603/install.json >/dev/null
          jq -e '
            .ok == false and
            .decision == "fail" and
            (.reasons | index("Not scanned by ClawHub")) != null and
            .security.clawhubScan == "unscanned" and
            .security.label == "Not scanned by ClawHub"
          ' proof/claw-603/verify.json >/dev/null

          : > proof/claw-603/trending-pages.jsonl
          trending_cursor=""
          declare -A trending_seen_cursors=()
          while true; do
            trending_url="$public_site/api/v1/trending?kind=skills&limit=100"
            if [[ -n "$trending_cursor" ]]; then
              encoded_cursor="$(jq -rn --arg value "$trending_cursor" '$value|@uri')"
              trending_url="$trending_url&cursor=$encoded_cursor"
            fi
            trending_page="$(curl --fail-with-body --silent --show-error "$trending_url")"
            jq -c . <<<"$trending_page" >> proof/claw-603/trending-pages.jsonl
            trending_cursor="$(jq -r '.nextCursor // empty' <<<"$trending_page")"
            if [[ -z "$trending_cursor" ]]; then
              break
            fi
            if [[ -n "${trending_seen_cursors[$trending_cursor]+x}" ]]; then
              echo "::error::Trending pagination repeated a cursor"
              exit 1
            fi
            trending_seen_cursors["$trending_cursor"]=1
          done
          jq -s '
            [.[].items[]] as $items |
            {
              pages:length,
              snapshotIds:(map(.snapshotId) | unique),
              total:($items | length),
              uniqueIds:($items | map(.id) | unique | length),
              rankSequence:(
                $items | map(.rank) == [range(1; ($items | length) + 1)]
              ),
              firstPagePublisherMax:(
                .[0].items |
                map(.sourceIdentity.owner // .publisher.handle // .id) |
                group_by(.) |
                map(length) |
                max
              ),
              native:($items | map(select(.source == "clawhub")) | length),
              skillsSh:($items | map(select(.source == "skills-sh")) | length),
              inferredSkillsSh24h:($items | map(select(.source == "skills-sh" and .metrics.trending24hInstalls != null)) | length)
            }
          ' proof/claw-603/trending-pages.jsonl > proof/claw-603/trending-summary.json
          jq -e '
            .pages > 0 and
            (.snapshotIds | length) == 1 and
            .total == .uniqueIds and
            .rankSequence == true and
            .firstPagePublisherMax <= 2 and
            .native > 0 and
            .skillsSh > 0 and
            .inferredSkillsSh24h == 0
          ' proof/claw-603/trending-summary.json >/dev/null

          : > proof/claw-603/latency-samples.jsonl
          for sample in $(seq 1 20); do
            search_latency="$(curl --fail-with-body --silent --output /dev/null --write-out '%{time_total}' \
              "$public_site/api/v1/search?q=$encoded_ref&mode=exact&limit=10")"
            detail_latency="$(curl --fail-with-body --silent --output /dev/null --write-out '%{time_total}' \
              "$public_site/api/v1/skills-sh/$encoded_owner/$encoded_repo/$encoded_slug")"
            trending_latency="$(curl --fail-with-body --silent --output /dev/null --write-out '%{time_total}' \
              "$public_site/api/v1/trending?kind=skills&limit=100")"
            jq -nc \
              --argjson sample "$sample" \
              --argjson searchSeconds "$search_latency" \
              --argjson detailSeconds "$detail_latency" \
              --argjson trendingSeconds "$trending_latency" \
              '{
                sample:$sample,
                searchSeconds:$searchSeconds,
                detailSeconds:$detailSeconds,
                trendingSeconds:$trendingSeconds
              }' >> proof/claw-603/latency-samples.jsonl
          done
          jq -s '
            def p95($values):
              ($values | sort) as $sorted |
              $sorted[((($sorted | length) * 0.95 | ceil) - 1)];
            {
              samples:length,
              searchP95Seconds:p95(map(.searchSeconds)),
              detailP95Seconds:p95(map(.detailSeconds)),
              trendingP95Seconds:p95(map(.trendingSeconds))
            }
          ' proof/claw-603/latency-samples.jsonl > proof/claw-603/latency.json
          jq -e '
            .samples == 20 and
            .searchP95Seconds <= 1 and
            .detailP95Seconds <= 1 and
            .trendingP95Seconds <= 1
          ' proof/claw-603/latency.json >/dev/null

          post_mirror \
            '{"operation":"deactivate","reason":"CLAW-603 permanent Test rollback proof"}' \
            proof/claw-603/rollback.json
          bunx convex run --no-push rolloutCapabilities:getPublicCapabilities '{}' \
            > proof/claw-603/capabilities-rolled-back.json
          curl --fail-with-body --silent --show-error \
            "$public_site/api/v1/search?q=$encoded_ref&mode=exact&limit=10" \
            > proof/claw-603/search-rolled-back.json
          detail_rolled_back_status="$(curl --silent --show-error --output \
            proof/claw-603/detail-rolled-back.json --write-out '%{http_code}' \
            "$public_site/api/v1/skills-sh/$encoded_owner/$encoded_repo/$encoded_slug")"
          install_rolled_back_status="$(curl --silent --show-error --output \
            proof/claw-603/install-rolled-back.json --write-out '%{http_code}' \
            "$public_site/api/v1/skills-sh/$encoded_owner/$encoded_repo/$encoded_slug/install")"
          : > proof/claw-603/trending-native-only-pages.jsonl
          native_cursor=""
          declare -A native_seen_cursors=()
          while true; do
            native_url="$public_site/api/v1/trending?kind=skills&limit=100"
            if [[ -n "$native_cursor" ]]; then
              encoded_cursor="$(jq -rn --arg value "$native_cursor" '$value|@uri')"
              native_url="$native_url&cursor=$encoded_cursor"
            fi
            native_page="$(curl --fail-with-body --silent --show-error "$native_url")"
            jq -c . <<<"$native_page" >> proof/claw-603/trending-native-only-pages.jsonl
            native_cursor="$(jq -r '.nextCursor // empty' <<<"$native_page")"
            if [[ -z "$native_cursor" ]]; then
              break
            fi
            if [[ -n "${native_seen_cursors[$native_cursor]+x}" ]]; then
              echo "::error::Native-only Trending pagination repeated a cursor"
              exit 1
            fi
            native_seen_cursors["$native_cursor"]=1
          done
          jq -s '
            [.[].items[]] as $items |
            {
              pages:length,
              snapshotIds:(map(.snapshotId) | unique),
              total:($items | length),
              uniqueIds:($items | map(.id) | unique | length),
              native:($items | map(select(.source == "clawhub")) | length),
              nonNative:($items | map(select(.source != "clawhub")) | length)
            }
          ' proof/claw-603/trending-native-only-pages.jsonl \
            > proof/claw-603/trending-native-only-summary.json
          jq -e '
            .ok == true and
            .enabled == false and
            .nativeTrending.status == "ready" and
            .nativeTrending.sourceCounts.skillsShTrending == 0 and
            ((.nativeTrending.sourceCounts.clawhubTrending // 0) +
              (.nativeTrending.sourceCounts.clawhubRising // 0)) > 0 and
            .scansPlanned == 0 and
            .scansAdmitted == 0
          ' proof/claw-603/rollback.json >/dev/null
          jq -e '
            .skillsSh.publicCatalogEnabled == false and
            .skillsSh.scanPlanningEnabled == false and
            .skillsSh.scanAdmissionEnabled == false
          ' proof/claw-603/capabilities-rolled-back.json >/dev/null
          jq -e '
            (.results | map(select(.source == "skills-sh")) | length) == 0
          ' proof/claw-603/search-rolled-back.json >/dev/null
          [[ "$detail_rolled_back_status" == "404" ]]
          [[ "$install_rolled_back_status" == "404" ]]
          jq -e '
            .pages > 0 and
            (.snapshotIds | length) == 1 and
            .total == .uniqueIds and
            .native > 0 and
            .nonNative == 0
          ' proof/claw-603/trending-native-only-summary.json >/dev/null
          activated=0

          post_mirror \
            '{"operation":"configure","enabled":true,"reason":"CLAW-603 permanent Test reactivation proof"}' \
            proof/claw-603/reactivation-configured.json
          # Arm fail-closed cleanup before the request can activate server-side.
          activated=1
          post_mirror \
            '{"operation":"verify-activate","reason":"CLAW-603 permanent Test reactivation proof"}' \
            proof/claw-603/reactivation.json
          post_mirror \
            '{"operation":"configure","enabled":false,"reason":"CLAW-603 permanent Test reactivation complete"}' \
            proof/claw-603/reactivation-control-disabled.json
          bunx convex run --no-push rolloutCapabilities:getPublicCapabilities '{}' \
            > proof/claw-603/capabilities-reactivated.json
          post_mirror '{"operation":"status"}' proof/claw-603/mirror-status-reactivated.json
          curl --fail-with-body --silent --show-error \
            "$public_site/api/v1/search?q=$encoded_ref&mode=exact&limit=10" \
            > proof/claw-603/search-reactivated.json
          curl --fail-with-body --silent --show-error \
            "$public_site/api/v1/skills-sh/$encoded_owner/$encoded_repo/$encoded_slug" \
            > proof/claw-603/detail-reactivated.json
          curl --fail-with-body --silent --show-error \
            "$public_site/api/v1/skills-sh/$encoded_owner/$encoded_repo/$encoded_slug/install" \
            > proof/claw-603/install-reactivated.json
          : > proof/claw-603/trending-reactivated-pages.jsonl
          reactivated_cursor=""
          declare -A reactivated_seen_cursors=()
          while true; do
            reactivated_url="$public_site/api/v1/trending?kind=skills&limit=100"
            if [[ -n "$reactivated_cursor" ]]; then
              encoded_cursor="$(jq -rn --arg value "$reactivated_cursor" '$value|@uri')"
              reactivated_url="$reactivated_url&cursor=$encoded_cursor"
            fi
            reactivated_page="$(curl --fail-with-body --silent --show-error "$reactivated_url")"
            jq -c . <<<"$reactivated_page" >> proof/claw-603/trending-reactivated-pages.jsonl
            reactivated_cursor="$(jq -r '.nextCursor // empty' <<<"$reactivated_page")"
            if [[ -z "$reactivated_cursor" ]]; then
              break
            fi
            if [[ -n "${reactivated_seen_cursors[$reactivated_cursor]+x}" ]]; then
              echo "::error::Reactivated Trending pagination repeated a cursor"
              exit 1
            fi
            reactivated_seen_cursors["$reactivated_cursor"]=1
          done
          jq -s '
            [.[].items[]] as $items |
            {
              pages:length,
              snapshotIds:(map(.snapshotId) | unique),
              total:($items | length),
              uniqueIds:($items | map(.id) | unique | length),
              native:($items | map(select(.source == "clawhub")) | length),
              skillsSh:($items | map(select(.source == "skills-sh")) | length)
            }
          ' proof/claw-603/trending-reactivated-pages.jsonl \
            > proof/claw-603/trending-reactivated-summary.json
          jq -e '
            .activated == true and
            .trendingSnapshot.status == "ready" and
            .trendingSnapshot.sourceCounts.skillsShTrending > 0 and
            ((.trendingSnapshot.sourceCounts.clawhubTrending // 0) +
              (.trendingSnapshot.sourceCounts.clawhubRising // 0)) > 0 and
            .corpus.hiddenEligible == 0 and
            .corpus.unsafePublished == 0 and
            .scansPlanned == 0 and
            .scansAdmitted == 0
          ' proof/claw-603/reactivation.json >/dev/null
          jq -e '
            .skillsSh.publicCatalogEnabled == true and
            .skillsSh.discoveryEnabled == true and
            .skillsSh.scanPlanningEnabled == false and
            .skillsSh.scanAdmissionEnabled == false
          ' proof/claw-603/capabilities-reactivated.json >/dev/null
          jq -e '
            .control.enabled == false and
            .control.paused == true and
            ([.runs[] | select(.status == "running" or .status == "paused" or .status == "reconciling")] | length == 0) and
            .invariants.publicVisible == true and
            .invariants.scanPlanningEnabled == false and
            .invariants.scanAdmissionEnabled == false
          ' proof/claw-603/mirror-status-reactivated.json >/dev/null
          jq -e --arg ref "$external_ref" '
            [.results[] | select(.id == $ref)] | length == 1
          ' proof/claw-603/search-reactivated.json >/dev/null
          jq -e --arg ref "$external_ref" '.reference == $ref' \
            proof/claw-603/detail-reactivated.json >/dev/null
          jq -e '
            .ok == true and
            .trust.clawhubScan == "unscanned" and
            .trust.label == "Not scanned by ClawHub"
          ' proof/claw-603/install-reactivated.json >/dev/null
          jq -e --slurpfile reactivation proof/claw-603/reactivation.json '
            .pages > 0 and
            (.snapshotIds | length) == 1 and
            .snapshotIds[0] == $reactivation[0].trendingSnapshot.snapshotId and
            .total == .uniqueIds and
            .native > 0 and
            .skillsSh > 0
          ' proof/claw-603/trending-reactivated-summary.json >/dev/null

          : > proof/claw-603/provenance-pages.jsonl
          cursor="null"
          while true; do
            page="$(bunx convex run --no-push --inline-query "
              const result = await ctx.db.query('skillsShMirrorDigests').paginate({cursor:$cursor,numItems:500});
              return {
                isDone: result.isDone,
                continueCursor: result.continueCursor,
                page: result.page.map((row) => ({
                  externalId: row.externalId,
                  lastObservedRunId: row.lastObservedRunId,
                  sourceType: row.sourceType,
                  githubPath: row.githubPath ?? null,
                  githubCommit: row.githubCommit ?? null,
                  sourceContentHash: row.sourceContentHash ?? null,
                  upstreamWarning: Object.values(row.upstreamScanners ?? {})
                    .some((scanner) => scanner.status !== 'pass'),
                  sourceFreshnessStatus: row.sourceFreshnessStatus,
                  detailStatus: row.detailStatus,
                  claimStatus: row.claimStatus ?? null,
                  publicVisible: row.publicVisible,
                  installable: row.installable,
                  active: row.active,
                  tombstoned: row.tombstonedAt !== undefined,
                })),
              };
            ")"
            jq -c . <<<"$page" >> proof/claw-603/provenance-pages.jsonl
            if [[ "$(jq -r '.isDone' <<<"$page")" == "true" ]]; then
              break
            fi
            cursor="$(jq -c '.continueCursor' <<<"$page")"
          done
          jq -s \
            --arg leaderboard "$leaderboard_run_id" \
            --arg trending "$trending_run_id" '
              [.[].page[]] as $rows |
              [$rows[] | select(
                .active == true and
                .tombstoned == false and
                .sourceType == "github" and
                .sourceFreshnessStatus == "observed-only" and
                .detailStatus == "available" and
                (.githubPath | type == "string" and length > 0) and
                (.githubCommit | type == "string" and length == 40) and
                (.sourceContentHash | type == "string" and length == 64) and
                .claimStatus == null
              )] as $eligible |
              {
                pages:length,
                total:($rows | length),
                uniqueExternalIds:($rows | map(.externalId) | unique | length),
                active:($rows | map(select(.active == true)) | length),
                tombstoned:($rows | map(select(.tombstoned == true)) | length),
                exactSourceEligible:($eligible | length),
                exactSourceEligiblePublished:($eligible | map(select(.publicVisible == true and .installable == true)) | length),
                eligiblePublishedWithUpstreamWarning:($eligible | map(select(.publicVisible == true and .upstreamWarning == true)) | length),
                activeFreshLeaderboard:($rows | map(select(.active == true and .lastObservedRunId == $leaderboard)) | length),
                activeFreshTrending:($rows | map(select(.active == true and .lastObservedRunId == $trending)) | length),
                activeOther:($rows | map(select(.active == true and .lastObservedRunId != $leaderboard and .lastObservedRunId != $trending)) | length)
              }
            ' proof/claw-603/provenance-pages.jsonl > proof/claw-603/provenance-summary.json
          jq -e '
            .total == .uniqueExternalIds and
            .active == (.activeFreshLeaderboard + .activeFreshTrending) and
            .exactSourceEligible > 0 and
            .exactSourceEligible == .exactSourceEligiblePublished and
            .eligiblePublishedWithUpstreamWarning > 0 and
            .activeOther == 0
          ' proof/claw-603/provenance-summary.json >/dev/null
          jq -e \
            --slurpfile provenance proof/claw-603/provenance-summary.json '
              .counts.sourceEligible == $provenance[0].exactSourceEligible and
              .counts.eligiblePublished == $provenance[0].exactSourceEligiblePublished
            ' proof/claw-603/visibility-audit.json >/dev/null
          jq '{
            leaderboardRunId:.leaderboard.runId,
            leaderboardSnapshotId:.leaderboard.snapshotId,
            leaderboardSourceTotal:.leaderboard.sourceTotal,
            leaderboardCounts:.leaderboard.counts,
            leaderboardStartedAt:.leaderboard.startedAt,
            leaderboardCompletedAt:.leaderboard.completedAt,
            trendingRunId:.trending.runId,
            trendingSnapshotId:.trending.snapshotId,
            trendingSourceTotal:.trending.sourceTotal,
            trendingCounts:.trending.counts,
            trendingStartedAt:.trending.startedAt,
            trendingCompletedAt:.trending.completedAt,
            syncCompletedAt:.completedAt,
            activationCorpus:.activation.corpus
          }' proof/claw-603/skills-sh-sync-proof.json > proof/claw-603/recovery-summary.json
          jq -n \
            --arg deploySha "$DEPLOY_SHA" \
            --slurpfile sync proof/claw-603/skills-sh-sync-proof.json \
            --slurpfile audit proof/claw-603/visibility-audit.json \
            --slurpfile provenance proof/claw-603/provenance-summary.json \
            --slurpfile externalTarget proof/claw-603/external-target.json \
            --slurpfile nativeBefore proof/claw-603/native-only-before-import.json \
            --slurpfile trending proof/claw-603/trending-summary.json \
            --slurpfile rollback proof/claw-603/rollback.json \
            --slurpfile reactivation proof/claw-603/reactivation.json \
            --slurpfile latency proof/claw-603/latency.json '
              {
                deploySha:$deploySha,
                completedAt:$sync[0].completedAt,
                durationMs:$sync[0].durationMs,
                recoveredRunId:($sync[0].recovered.runId // null),
                leaderboardRunId:$sync[0].leaderboard.runId,
                leaderboardSnapshotId:$sync[0].leaderboard.snapshotId,
                leaderboardSourceTotal:$sync[0].leaderboard.sourceTotal,
                leaderboardCounts:$sync[0].leaderboard.counts,
                trendingRunId:$sync[0].trending.runId,
                trendingSnapshotId:$sync[0].trending.snapshotId,
                trendingSourceTotal:$sync[0].trending.sourceTotal,
                trendingCounts:$sync[0].trending.counts,
                activation:$sync[0].activation,
                audit:$audit[0],
                provenance:$provenance[0],
                externalTarget:$externalTarget[0],
                nativeBeforeImport:$nativeBefore[0],
                publicTrending:$trending[0],
                rollback:$rollback[0],
                reactivation:$reactivation[0],
                latency:$latency[0],
                claimLifecycleProof:{
                  initialRunId:"30608116457",
                  completedRecoveryRunId:"30609603963",
                  deterministicFakeVerdicts:true,
                  explicitFailureTrigger:true,
                  paidScans:0
                }
              }
            ' > proof/claw-603/test-proof-summary.json

          finalizing=1
          cleanup
          finalizing=0
          [[ "$proof_complete" == "1" ]]
          trap - EXIT
          jq -e '.disableExit == 0 and .tokenRotationExit == 0 and .revokedStatus == "401"' \
            proof/claw-603/cleanup.json >/dev/null

      - name: Upload CLAW-603 fresh-recovery proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: claw-603-fresh-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: proof/claw-603/

      - name: Mark the durable recovery proof complete
        id: complete
        run: echo "proof_complete=1" >> "$GITHUB_OUTPUT"

  cleanup-backstop:
    needs: permanent-test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Test
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      DEPLOY_SHA: 110f92a0ef1c88889b09f80801421998a114988b
      PROOF_COMPLETE: ${{ needs.permanent-test.outputs.proof_complete }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 110f92a0ef1c88889b09f80801421998a114988b

      - uses: ./.github/actions/setup-bun

      - name: Enforce permanent-Test cleanup independently of the sync runner
        run: |
          set -euo pipefail
          mkdir -p proof/claw-603-cleanup
          bunx convex run --no-push appMeta:getDeploymentInfo '{}' \
            > proof/claw-603-cleanup/deployment.json
          jq -e --arg sha "$DEPLOY_SHA" '.appBuildSha == $sha' \
            proof/claw-603-cleanup/deployment.json >/dev/null

          deactivate_exit=0
          if [[ "$PROOF_COMPLETE" != "1" ]]; then
            bunx convex run --no-push skillsShMirrorVisibility:setPublicGateInternal \
              '{
                "enabled":false,
                "actor":"CLAW-603 cleanup backstop",
                "reason":"CLAW-603 recovery did not complete",
                "confirm":"deactivate-skills-sh-public-test"
              }' > proof/claw-603-cleanup/deactivation.json 2>&1 || deactivate_exit=$?
          fi

          disable_exit=0
          bunx convex run --no-push skillsShMirror:configureInternal \
            '{
              "actor":"CLAW-603 cleanup backstop",
              "reason":"CLAW-603 recovery cleanup backstop",
              "confirm":"enable-skills-sh-mirror-test",
              "enabled":false,
              "maxRowsPerRun":50000,
              "maxRowsPerBatch":50,
              "maxDetailBytes":65536
            }' > proof/claw-603-cleanup/control-disabled.json 2>&1 || disable_exit=$?

          token_rotation_exit=0
          bunx convex run --no-push devSeed:seedCliRoleHelpFixtures '{}' >/dev/null \
            || token_rotation_exit=$?
          bunx convex run --no-push rolloutCapabilities:getPublicCapabilities '{}' \
            > proof/claw-603-cleanup/capabilities.json
          bunx convex run --no-push skillsShMirror:getIsolationInternal '{}' \
            > proof/claw-603-cleanup/isolation.json
          jq -n \
            --arg proofComplete "$PROOF_COMPLETE" \
            --argjson deactivateExit "$deactivate_exit" \
            --argjson disableExit "$disable_exit" \
            --argjson tokenRotationExit "$token_rotation_exit" \
            '{
              proofComplete:$proofComplete,
              deactivateExit:$deactivateExit,
              disableExit:$disableExit,
              tokenRotationExit:$tokenRotationExit
            }' > proof/claw-603-cleanup/result.json

          jq -e '
            .skillsSh.writesEnabled == false and
            .skillsSh.scanPlanningEnabled == false and
            .skillsSh.scanAdmissionEnabled == false
          ' proof/claw-603-cleanup/capabilities.json >/dev/null
          if [[ "$PROOF_COMPLETE" == "1" ]]; then
            jq -e '.skillsSh.publicCatalogEnabled == true' \
              proof/claw-603-cleanup/capabilities.json >/dev/null
          else
            jq -e '.skillsSh.publicCatalogEnabled == false' \
              proof/claw-603-cleanup/capabilities.json >/dev/null
          fi
          jq -e '
            .deactivateExit == 0 and
            .disableExit == 0 and
            .tokenRotationExit == 0
          ' proof/claw-603-cleanup/result.json >/dev/null

      - name: Upload CLAW-603 cleanup-backstop proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: claw-603-cleanup-backstop-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: proof/claw-603-cleanup/
