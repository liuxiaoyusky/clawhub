name: skills.sh Production Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: skills-sh-production-sync
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    environment:
      name: Production
    steps:
      - name: Require main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::skills.sh production sync must run from refs/heads/main"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Print non-secret GitHub OIDC identity claims
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=clawhub" \
            | jq -er '.value')"
          echo "::add-mask::$token"
          TOKEN="$token" bun -e '
            const payload = JSON.parse(
              Buffer.from(process.env.TOKEN.split(".")[1], "base64url").toString("utf8"),
            );
            const names = [
              "iss", "aud", "repository", "repository_id", "repository_owner",
              "repository_owner_id", "workflow_ref", "job_workflow_ref",
              "runner_environment", "environment", "event_name", "workflow",
              "sha", "ref", "ref_type", "actor", "actor_id", "run_id",
              "run_attempt", "sub",
            ];
            console.log(JSON.stringify(Object.fromEntries(
              names.filter((name) => payload[name] !== undefined)
                .map((name) => [name, payload[name]]),
            ), null, 2));
          '
